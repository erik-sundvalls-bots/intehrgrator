<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>intEHRgrator — Better Form Viewer</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #14222b; }
    #banner {
      padding: 8px 12px; background: #003B49; color: #fff; font-size: 13px;
    }
    #banner.warn { background: #854d0e; }
    #panel {
      padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 42rem;
    }
    #panel p { margin: 0; font-size: 14px; line-height: 1.45; }
    #panel button { align-self: flex-start; }
    #status { font-size: 13px; }
    #host { margin: 0; padding: 12px; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <div id="banner" class="warn">Better Form Renderer is not in this browser.</div>
  <div id="panel">
    <p id="explainer"></p>
    <p id="status">No renderer stored yet.</p>
    <input id="vendor-upload-input" type="file" accept=".js,.css" multiple hidden />
    <button id="upload-vendor-btn" type="button">Upload renderer</button>
    <button id="clear-vendor-btn" type="button" hidden>Clear renderer</button>
  </div>
  <pre id="host"></pre>
  <script type="module" src="./better_form_viewer.js"></script>
</body>
</html>
