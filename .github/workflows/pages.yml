# Deploy the static web app to GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Share the group with release.yml; never cancel an in-flight release Pages deploy.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # release.yml owns Pages deploy when `deno task release` or Release create
    # pushes a `chore: release …` commit together with its tag.
    # head_commit is often null on merge/push webhooks — treat that as a normal main deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit == null ||
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: deno task vendor
      - run: deno task test
      - run: deno task build
      - name: Preserve frozen release versions on GitHub Pages
        run: deno run -A scripts/assemble-pages.ts main dist dist-pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v5
