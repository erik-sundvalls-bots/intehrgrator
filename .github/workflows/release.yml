# Publish desktop binaries and a frozen GitHub Pages subdirectory for each release tag.
# Triggered by `deno task release` (push annotated tag) or manual tag push.
# Maintainer flow, tag naming, recovery dispatch: README_DEVELOPERS.md § Releases.

name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.6)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Resolve release tag
        id: rel
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Vendor ehrtslib
        run: deno task vendor

      - name: Test
        run: deno task test

      - name: Build web app
        run: deno task build

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.51.0 install --with-deps chromium

      - name: UI tests
        env:
          UI_TEST_SKIP_BUILD: "1"
        run: deno task test:ui

      # Pages first so a desktop compile failure cannot block the frozen web app.
      - name: Assemble versioned GitHub Pages tree
        run: deno run -A scripts/assemble-pages.ts release "${{ steps.rel.outputs.tag }}" dist dist-pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Compile desktop binaries
        run: deno task compile:desktop

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          PAGES_URL="https://regionstockholm.github.io/intehrgrator/${TAG}/"
          {
            echo "## intEHRgrator desktop ${TAG#v}"
            echo
            echo "Local Integration Workbench as a Deno desktop app (OS webview). Same Mapping Editor as the [web app for this release](${PAGES_URL}), packaged for offline use on \`127.0.0.1\`."
            echo
            echo "### Web app (frozen for this release)"
            echo
            echo "- **This version:** [${PAGES_URL}](${PAGES_URL})"
            echo "- **Bleeding edge (main) always aveilable at:** https://regionstockholm.github.io/intehrgrator/"
            echo
            echo "### Linux"
            echo
            echo "The AppImage uses the system WebKitGTK 4.1 (with libsoup 3), also with \`--headless\`. If it fails with \`libwebkit2gtk-4.1.so.0: cannot open shared object file\`, install it: \`sudo apt install libwebkit2gtk-4.1-0\` (Debian/Ubuntu) or \`sudo dnf install webkit2gtk4.1\` (Fedora)."
            echo
            echo "### What's new"
            echo
            echo "See [CHANGELOG.md](https://github.com/regionstockholm/intehrgrator/blob/${TAG}/CHANGELOG.md) for the changes in this and previous releases."
          } > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets only"
          else
            gh release create "$TAG" \
              --title "intEHRgrator desktop ${TAG#v}" \
              --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" dist/release/intEHRgrator-linux-x64.AppImage --clobber
          gh release upload "$TAG" dist/release/intEHRgrator-windows-x64.zip --clobber
          gh release upload "$TAG" dist/release/intEHRgrator-macos-x64.zip --clobber
          gh release upload "$TAG" dist/release/intEHRgrator-macos-arm64.zip --clobber
