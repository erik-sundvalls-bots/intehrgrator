name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Vendor ehrtslib
        run: deno task vendor
      - name: Test
        run: deno task test
      - name: Check file project output
        run: deno task project:run examples/file-project/intehrgrator.json --check
      - name: Build
        run: deno task build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  ui-test:
    name: UI tests
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.51.0 install --with-deps chromium
      - name: UI tests
        env:
          UI_TEST_SKIP_BUILD: "1"
        run: deno task test:ui
