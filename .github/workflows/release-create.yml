# Create a new release tag. Publish stays in release.yml, which runs when the
# tag is pushed. This workflow bumps version files, commits on the chosen
# branch (default main), and pushes an annotated tag. It does not deploy Pages
# or upload release assets.
#
# workflow_dispatch on release.yml is recovery for an existing tag, not this.
# Maintainer flow: README_DEVELOPERS.md § Releases.

name: Release create

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package semver to release (0.8.9 → tag v0.8.9, 0.9.0 → tag v0.9)"
        required: true
        type: string
      ref:
        description: "Branch that receives the version-bump commit"
        required: false
        type: string
        default: "main"
      update_recommended:
        description: "Also set RECOMMENDED_VERSION to the new tag (default off)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Validate only; do not commit, tag, or push"
        required: false
        type: boolean
        default: false

# Read-only GITHUB_TOKEN. The tag push uses RELEASE_PAT so release.yml starts.
permissions:
  contents: read

# A second dispatch of the same version waits, then the tag check refuses it.
# Do not cancel the run that is already tagging.
concurrency:
  group: release-create-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Require RELEASE_PAT so the tag push starts release.yml
        if: inputs.dry_run != true
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PAT}" ]; then
            echo "RELEASE_PAT is not set."
            echo "Use a fine-grained PAT or GitHub App token with Contents read and write on this repository."
            echo "Store it as the Actions secret RELEASE_PAT (an environment secret on release is the tighter place)."
            echo "Pushing with the default GITHUB_TOKEN does not start release.yml, so Pages, desktop, and the GitHub Release would not be published."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ case(inputs.dry_run, github.token, secrets.RELEASE_PAT) }}
          persist-credentials: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Bump version files, commit, and push annotated tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_UPDATE_RECOMMENDED: ${{ inputs.update_recommended }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          TZ: UTC
        run: deno run -A scripts/release_create.ts
